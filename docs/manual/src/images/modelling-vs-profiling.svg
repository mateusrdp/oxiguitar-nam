<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Helvetica, Arial, sans-serif" font-size="14"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><title>Amp modelling simulates the circuit; amp profiling learns from what one real amp did</title><rect width="800" height="330" fill="#fff"/><rect x="20" y="20" width="370" height="46" rx="8" fill="#eef4fa" stroke="#1f6fb2" stroke-width="1.5"/><text x="205.0" y="48.0" text-anchor="middle" fill="#222" font-weight="bold">Modelling (white box)</text><rect x="410" y="20" width="370" height="46" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="48.0" text-anchor="middle" fill="#222" font-weight="bold">Profiling or capturing (black box)</text><text x="30" y="98" fill="#222">Engineers study the circuit: tubes,</text><text x="30" y="122" fill="#222">transformers, tone stack, every knob.</text><text x="30" y="146" fill="#222">They write code that behaves the same.</text><text x="30" y="170" fill="#222"></text><text x="30" y="194" fill="#222">+ every knob works, any setting</text><text x="30" y="218" fill="#222">- each amp takes a lot of expert work</text><text x="30" y="242" fill="#1f6fb2" font-style="italic">Line 6 Helix, Fractal Axe-Fx, Boss Katana</text><text x="420" y="98" fill="#222">Play test signals through one real amp,</text><text x="420" y="122" fill="#222">record what comes out, and fit a model</text><text x="420" y="146" fill="#222">that does the same thing to any input.</text><text x="420" y="170" fill="#222"></text><text x="420" y="194" fill="#222">+ very close to that amp, at that setting</text><text x="420" y="218" fill="#222">+ anyone with the amp can make one</text><text x="420" y="242" fill="#222">- one snapshot: turning a knob means a new capture</text><text x="420" y="266" fill="#c0392b" font-style="italic">Kemper, Quad Cortex, ToneX, NAM</text><line x1="400" y1="80" x2="400" y2="300" stroke="#ddd"/></svg>