<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Helvetica, Arial, sans-serif" font-size="14"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><title>How a NAM capture is made: a test signal goes through the real amp, and a neural network learns to turn the one into the other</title><rect width="800" height="300" fill="#fff"/><text x="20" y="28" font-weight="bold" fill="#222">Making a capture (done once, by whoever owns the amp)</text><rect x="20" y="60" width="170" height="60" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="105.0" y="86.0" text-anchor="middle" fill="#222" font-weight="bold">Test signal</text><text x="105.0" y="104.0" text-anchor="middle" fill="#222" font-size="12">a few minutes of sweeps</text><rect x="300" y="60" width="170" height="60" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="385.0" y="86.0" text-anchor="middle" fill="#222" font-weight="bold">The real amp</text><text x="385.0" y="104.0" text-anchor="middle" fill="#222" font-size="12">set the way you like it</text><rect x="580" y="60" width="190" height="60" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="675.0" y="86.0" text-anchor="middle" fill="#222" font-weight="bold">Recording</text><text x="675.0" y="104.0" text-anchor="middle" fill="#222" font-size="12">of what came out</text><line x1="190" y1="90" x2="298" y2="90" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><line x1="470" y1="90" x2="578" y2="90" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="190" width="360" height="64" rx="8" fill="#eef4fa" stroke="#1f6fb2" stroke-width="1.5"/><text x="400.0" y="218.0" text-anchor="middle" fill="#222" font-weight="bold">Training</text><text x="400.0" y="236.0" text-anchor="middle" fill="#222" font-size="12">a neural network learns to turn the input into the output</text><path d="M105,120 L105,222 L218,222" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><path d="M675,120 L675,222 L582,222" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="400" y="286" text-anchor="middle" fill="#1f6fb2" font-weight="bold">result: one .nam file, which OxiGuitar plays your notes through</text></svg>