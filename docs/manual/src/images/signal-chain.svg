<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="Helvetica, Arial, sans-serif" font-size="14"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs><title>How a track sounds with the NAM plugin: notes, clean guitar, amp model, cabinet, speakers</title><rect width="800" height="200" fill="#fff"/><text x="20" y="28" font-weight="bold" fill="#222">One track in OxiGuitar, from the score to your speakers</text><rect x="20" y="70" width="130" height="64" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="85.0" y="98.0" text-anchor="middle" fill="#222" font-weight="bold">Score</text><text x="85.0" y="116.0" text-anchor="middle" fill="#222" font-size="12">the notes</text><rect x="170" y="70" width="130" height="64" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="235.0" y="98.0" text-anchor="middle" fill="#222" font-weight="bold">MIDI plugin</text><text x="235.0" y="116.0" text-anchor="middle" fill="#222" font-size="12">plays a clean guitar</text><line x1="148" y1="102" x2="168" y2="102" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="70" width="130" height="64" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="395.0" y="98.0" text-anchor="middle" fill="#222" font-weight="bold">Amp model</text><text x="395.0" y="116.0" text-anchor="middle" fill="#222" font-size="12">.nam file</text><line x1="308" y1="102" x2="328" y2="102" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="490" y="70" width="130" height="64" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="555.0" y="98.0" text-anchor="middle" fill="#222" font-weight="bold">Cabinet</text><text x="555.0" y="116.0" text-anchor="middle" fill="#222" font-size="12">impulse response</text><line x1="468" y1="102" x2="488" y2="102" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><rect x="650" y="70" width="130" height="64" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/><text x="715.0" y="98.0" text-anchor="middle" fill="#222" font-weight="bold">Mixer</text><text x="715.0" y="116.0" text-anchor="middle" fill="#222" font-size="12">to your speakers</text><line x1="628" y1="102" x2="648" y2="102" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/><text x="330" y="168" fill="#c0392b" font-size="12">the amp: gain, tone, distortion</text><text x="490" y="186" fill="#c98a1b" font-size="12">the speaker box and its microphone</text></svg>