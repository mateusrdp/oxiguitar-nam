# Test builds and releases (#165). The work is oxiguitar-packages' reusable workflow
# plugin-release.yml: it runs build-oxp.sh on each system and makes a zip per
# target, a .deb and an .rpm (oxiguitar-nam), a per-user Windows installer, a macOS
# .pkg and SHA256SUMS.
#
# - On a pull request, and on a push to develop or main: nothing is
#   released. The files stay under the run for 14 days, with a ~dev version;
#   those are the test builds.
# - On a pushed v* tag (only the maintainer makes them; v plus the version in
#   Cargo.toml): a DRAFT release holding all of it. Publishing the draft
#   starts publish.yml.
name: Release

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: mateusrdp/oxiguitar-packages/.github/workflows/plugin-release.yml@main
    with:
      name: nam
      title: "NAM (amp models)"
      description: "Amp models (Neural Amp Modeler captures) and cabinet impulse responses on guitar and bass tracks."
      # ci.yml has run the tests on six systems.
      test: false
      depends-deb: "oxiguitar-midi (>= 0.1.0)"
      depends-rpm: "oxiguitar-midi >= 0.1.0"
    permissions:
      contents: write
